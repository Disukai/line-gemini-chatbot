[project]
name = "line-gemini-chatbot"
version = "1.0.0"
description = "Realistic Human-like LINE AI Group Chatbot powered by Gemini 3.8 Flash"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "line-bot-sdk>=3.12.0",
    "google-genai>=2.3.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "typesafe-sdk>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

